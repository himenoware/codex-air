[package]
name = "codex-air"
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
description = "A focused native workspace for Codex on Windows"
publish = false

[dependencies]
gpui-kit = "=0.6.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
async-channel = "2"
raw-window-handle = "0.6"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_Security"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
debug = false
strip = "debuginfo"

[profile.dev]
debug = 1

[profile.dev.package.gpui-pre]
opt-level = 2
